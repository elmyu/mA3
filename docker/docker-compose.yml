services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment:
      SECRET_KEY: minibmehub-prod-secret
      JWT_SECRET_KEY: minibmehub-prod-jwt-secret-key-2026
    volumes:
      - db_data:/app/instance
      - uploads_data:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8080:80"
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:
